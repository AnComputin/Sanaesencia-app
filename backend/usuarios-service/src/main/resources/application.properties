
spring.application.name=usuarios-service

server.port=${SERVER_PORT:8081}

# CONEXION MYSQL - APP MOVIL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sana_usuarios_db_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=America/Santiago}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ACTUATOR
management.endpoints.web.exposure.include=health,info

# JWT CONFIGURACION (Compartir exactamente estos mismos valores en los 5 microservicios)
jwt.secret=${JWT_SECRET:c2FuYWVzZW5jaWEtYXBwLXNlY3JldC1rZXktMjAyNi1jaGlsZS1qd3Q=}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# Administrador inicial de desarrollo. Sobrescribir mediante variables de entorno en despliegues.
app.admin.bootstrap-enabled=${APP_ADMIN_BOOTSTRAP_ENABLED:true}
app.admin.email=${APP_ADMIN_EMAIL:admin@sanaesencia.cl}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}
