spring.application.name=catalogo-service
server.port=8082

# CONEXION MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/sana_catalogo_db_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ACTUATOR
management.endpoints.web.exposure.include=health,info

