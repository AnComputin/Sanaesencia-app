server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 10m;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/usuarios {
        set $upstream_usuarios usuarios-service:8081;
        proxy_pass http://$upstream_usuarios;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/beneficiarios {
        set $upstream_usuarios usuarios-service:8081;
        proxy_pass http://$upstream_usuarios;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/especialidades {
        set $upstream_catalogo catalogo-service:8082;
        proxy_pass http://$upstream_catalogo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/especialistas {
        set $upstream_terapeutas terapeutas-service:8083;
        proxy_pass http://$upstream_terapeutas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/citas {
        set $upstream_agenda agenda-service:8084;
        proxy_pass http://$upstream_agenda;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/productos {
        set $upstream_tienda tienda-service:8085;
        proxy_pass http://$upstream_tienda;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ventas {
        set $upstream_tienda tienda-service:8085;
        proxy_pass http://$upstream_tienda;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
