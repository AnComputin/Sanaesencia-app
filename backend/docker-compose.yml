x-java-env: &java-env
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
  SPRING_JPA_SHOW_SQL: "false"
  JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m"

services:
  mysql:
    image: mysql:8.0
    container_name: sanaesencia-mysql
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=60
      - --performance-schema=OFF
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      TZ: America/Santiago
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  usuarios-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: usuarios-service
    container_name: sanaesencia-usuarios
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sana_usuarios_db_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=America/Santiago
      APP_ADMIN_BOOTSTRAP_ENABLED: ${APP_ADMIN_BOOTSTRAP_ENABLED:-true}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@sanaesencia.cl}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin123}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  catalogo-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: catalogo-service
    container_name: sanaesencia-catalogo
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sana_catalogo_db_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=America/Santiago
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  terapeutas-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: terapeutas-service
    container_name: sanaesencia-terapeutas
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sana_terapeutas_db_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=America/Santiago
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  agenda-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: agenda-service
    container_name: sanaesencia-agenda
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sana_agenda_db_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=America/Santiago
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  tienda-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: tienda-service
    container_name: sanaesencia-tienda
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sana_tienda_db_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=America/Santiago
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  nginx:
    image: nginx:1.27-alpine
    container_name: sanaesencia-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - usuarios-service
      - catalogo-service
      - terapeutas-service
      - agenda-service
      - tienda-service

volumes:
  mysql_data:
